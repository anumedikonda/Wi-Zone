<div class="request-wrapper">
  <div class="request-card">
    <button
      type="button"
      class="back-btn"
      (click)="goBack()"
    >
      Back
    </button>

    <h2>WiFi Scheme Request Form</h2>
    <hr />

    <form
      [formGroup]="requestForm"
      (ngSubmit)="onSubmit()"
    >
      <div class="form-group">
        <label>Street Name*</label>

        <input
          type="text"
          formControlName="streetName"
        />

        <small
          class="error"
          *ngIf="
            f['streetName'].touched &&
            f['streetName'].errors?.['required']
          "
        >
          Street Name is required
        </small>
      </div>

      <div class="form-group">
        <label>Landmark*</label>

        <input
          type="text"
          formControlName="landmark"
        />

        <small
          class="error"
          *ngIf="
            f['landmark'].touched &&
            f['landmark'].errors?.['required']
          "
        >
          Landmark is required
        </small>
      </div>

      <div class="form-group">
        <label>City*</label>

        <input
          type="text"
          formControlName="city"
        />

        <small
          class="error"
          *ngIf="
            f['city'].touched &&
            f['city'].errors?.['required']
          "
        >
          City is required
        </small>
      </div>

      <div class="form-group">
        <label>State*</label>

        <input
          type="text"
          formControlName="state"
        />

        <small
          class="error"
          *ngIf="
            f['state'].touched &&
            f['state'].errors?.['required']
          "
        >
          State is required
        </small>
      </div>

      <div class="form-group">
        <label>ZIP Code*</label>

        <input
          type="text"
          formControlName="zipCode"
        />

        <small
          class="error"
          *ngIf="
            f['zipCode'].touched &&
            f['zipCode'].errors?.['required']
          "
        >
          ZIP Code is required
        </small>

        <small
          class="error"
          *ngIf="
            f['zipCode'].touched &&
            f['zipCode'].errors?.['min']
          "
        >
          ZIP Code must be valid
        </small>

        <small
          class="error"
          *ngIf="
            f['zipCode'].touched &&
            f['zipCode'].errors?.['pattern']
          "
        >
          ZIP Code must be 6 digits
        </small>
      </div>

      <div class="form-group">
        <label>Preferred Setup Date*</label>

        <input
          type="date"
          formControlName="preferredSetupDate"
          [min]="today"
        />

        <small
          class="error"
          *ngIf="
            f['preferredSetupDate'].touched &&
            f['preferredSetupDate']
              .errors?.['required']
          "
        >
          Preferred Setup Date is required
        </small>
      </div>

      <div class="form-group">
        <label>Time Slot*</label>

        <select formControlName="timeSlot">
          <option value="">
            Select time slot
          </option>

          <option value="09:00 AM - 11:00 AM">
            09:00 AM - 11:00 AM
          </option>

          <option value="11:00 AM - 01:00 PM">
            11:00 AM - 01:00 PM
          </option>

          <option value="01:00 PM - 03:00 PM">
            01:00 PM - 03:00 PM
          </option>

          <option value="03:00 PM - 05:00 PM">
            03:00 PM - 05:00 PM
          </option>

          <option value="05:00 PM - 07:00 PM">
            05:00 PM - 07:00 PM
          </option>
        </select>

        <small
          class="error"
          *ngIf="
            f['timeSlot'].touched &&
            f['timeSlot'].errors?.['required']
          "
        >
          Time Slot is required
        </small>
      </div>

      <div class="form-group">
        <label>Proof (Upload Document)*</label>

        <input
          type="file"
          accept="image/*,.pdf"
          (change)="onFileChange($event)"
        />

        <small
          class="error"
          *ngIf="proofError"
        >
          {{ proofError }}
        </small>
      </div>

      <div class="form-group">
        <label>Comments</label>

        <textarea
          rows="3"
          formControlName="comments"
        ></textarea>
      </div>

      <button
        type="submit"
        class="btn-primary"
      >
        Submit Request
      </button>
    </form>

    <div
      class="modal"
      *ngIf="showSuccessModal"
    >
      <div class="modal-content">
        <p>
          Request Submitted Successfully!
        </p>

        <button
          type="button"
          class="btn-primary"
          (click)="closeModal()"
        >
          OK
        </button>
      </div>
    </div>
  </div>
</div>
