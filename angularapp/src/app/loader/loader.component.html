<div class="loader-overlay" *ngIf="loading$ | async">
  <div class="wifi-loader-box">
    <div class="wifi-symbol">
      <span class="wifi-line wifi-line-one"></span>
      <span class="wifi-line wifi-line-two"></span>
      <span class="wifi-line wifi-line-three"></span>
      <span class="wifi-center-dot"></span>
    </div>

    <p class="loader-text">Loading...</p>
  </div>
</div>
